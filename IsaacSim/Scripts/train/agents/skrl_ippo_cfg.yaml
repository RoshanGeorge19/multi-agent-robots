# IPPO configuration for the two-robot collision-avoidance environment.
#
# IPPO (independent PPO) is the right fit here: each agent keeps its own policy
# and its own critic, with no shared critic and no parameter sharing. That matches
# the environment, where the two robots do not even share an action space --
# the rover takes 2 velocity commands, the XGO takes 12 joint targets.
#
# Field names follow skrl's IPPO_DEFAULT_CONFIG.
# https://skrl.readthedocs.io/en/latest/api/multi_agents/ippo.html

seed: 42

models:
  separate: True          # independent policy and value networks
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        # Wider than IsaacLab's cart_double_pendulum reference ([32, 32]): these
        # observations are dominated by a 256-ray lidar scan, not a handful of
        # joint states.
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1         # matches agent:rollouts

agent:
  class: IPPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2   # > 0 also enables clipping of predicted values
  # Small positive entropy bonus: both agents start from a standing/idle basin,
  # and the XGO in particular has to explore 12-DoF joint space to find any gait.
  entropy_loss_scale: 0.005
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: True
  experiment:
    directory: "collision_avoidance"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 24000
  environment_info: log
